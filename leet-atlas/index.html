<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172f3a">
  <meta name="description" content="2027학년도 LEET 추리논증 40문항의 원문, 분류, 해설을 검토하는 학습 도구">
  <title>LEET Atlas · 2027 추리논증 검수판</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <a class="brand" href="#/questions" aria-label="LEET Atlas 문항 목록">
      <span class="brand-symbol" aria-hidden="true">L<span>·</span>A</span>
      <span class="brand-name">LEET <strong>Atlas</strong><small>추리논증의 구조를 읽다</small></span>
    </a>
    <div class="header-edition"><span>2027학년도</span><strong>추리논증 <span class="edition-count">40</span></strong></div>
    <div class="header-actions"><span class="draft-label"><i></i>검수용 초안</span><button id="export-reviews" class="button button-quiet" type="button">검수 기록 내보내기</button></div>
  </header>
  <main id="main" tabindex="-1"><div class="loading-state"><span class="loading-dot"></span>문항과 해설을 불러오고 있습니다.</div></main>
  <footer class="site-footer"><span>LEET Atlas · 2027 검수판</span><span>공식정답 외부 대조 미완료 · 원본의 회색 강조를 유지했습니다.</span></footer>
  <div id="tag-tooltip" class="tag-tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="image-dialog" class="image-dialog" aria-labelledby="image-dialog-title">
    <div class="dialog-toolbar"><strong id="image-dialog-title">문항 원본 확대</strong><span class="dialog-hint">이미지를 가로로 이동해 확인할 수 있습니다.</span><button class="icon-button" id="close-image" type="button" aria-label="원본 확대 닫기">✕</button></div>
    <div class="dialog-image-wrap"><img id="enlarged-image" alt=""></div>
  </dialog>
  <noscript><p class="error-state">문항 목록과 해설을 보려면 자바스크립트를 켜 주세요.</p></noscript>
</body>
</html>
